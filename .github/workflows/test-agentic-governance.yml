name: Test agentic governance demo

on:
  push:
    paths:
      - "runnable/**"
      - ".github/workflows/test-agentic-governance.yml"
  pull_request:
    paths:
      - "runnable/**"
      - ".github/workflows/test-agentic-governance.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run governance tests
        run: python -m unittest discover -s runnable/tests -v
